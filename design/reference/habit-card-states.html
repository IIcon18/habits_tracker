<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Капля — состояния карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground,#0F1626)}
body{font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;border:0;background:none;color:inherit}
button{cursor:pointer}
.stage{padding:24px 24px 32px;color:var(--ink,#E6ECF5)}
.intro{display:flex;gap:24px;align-items:flex-start;justify-content:space-between;margin:0 auto 22px;max-width:100%}
.intro h1{font:600 24px/1.15 Unbounded,sans-serif;letter-spacing:-.01em}
.intro h1 small{display:block;font:600 13px/1.4 Manrope,sans-serif;color:var(--ink-muted,#93A1B8);letter-spacing:0;margin-bottom:6px}
.intro p{font:500 14px/1.5 Manrope,sans-serif;color:var(--ink-muted,#93A1B8);max-width:440px;margin-top:6px}
.intro p b{color:var(--ink,#E6ECF5);font-weight:700}
.thsw{display:inline-flex;flex:none;padding:3px;border-radius:999px;background:var(--surface,#182238)}
.thsw button{height:32px;padding:0 14px;border-radius:999px;font:600 13px/1 Manrope;color:var(--ink-muted,#93A1B8)}
.thsw button[aria-pressed=true]{background:var(--accent-soft,#22345A);color:var(--ink,#E6ECF5)}
.row{display:flex;gap:36px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{font:600 13px/1.35 Manrope,sans-serif;color:var(--ink-muted,#93A1B8);text-align:center;max-width:390px}
.cap b{color:var(--ink,#E6ECF5)}

/* ---------- themes (dark is primary) ---------- */
.phone,.th{--g:#0F1626;--s:#182238;--s2:#1F2B45;--sunk:#121B2E;--ink:#E6ECF5;--mut:#93A1B8;--line:#26334F;--acc:#6FA0F5;--on-acc:#0F1626;--acc-ink:#9DB8E8;--soft:#22345A;--on-soft:#C9DAF5;--amb:#E3A64A;--amb-ink:#E3A64A;--amb-soft:#2E2618;--frame:#2B3650;--bezel:#05080F;--tg-link:#6AB2F2;--tg-red:#EF5B5B;--tg-pop:#1C2433}
.th-light .phone,.th-light .th{--g:#E9EEF2;--s:#F7F9FB;--s2:#FFFFFF;--sunk:#DDE4EA;--ink:#18233A;--mut:#5B6B85;--line:#D3DBE3;--acc:#2F6FDB;--on-acc:#FFFFFF;--acc-ink:#2459B8;--soft:#C9DAF5;--on-soft:#1F4FA8;--amb:#B7791F;--amb-ink:#8A5A12;--amb-soft:#F6EBD7;--frame:#C5CFD9;--bezel:#1B2232;--tg-link:#2481CC;--tg-red:#E53935;--tg-pop:#F2F2F5}

/* ---------- phone + telegram chrome ---------- */
.phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:var(--g);color:var(--ink);flex:none;
  box-shadow:0 0 0 1px var(--frame),0 0 0 9px var(--bezel);transition:--p .9s cubic-bezier(.3,.7,.2,1)}
.phone.long{height:auto;min-height:844px;padding-bottom:110px}
.phone.long .scroll{position:relative;top:0}
.sb{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 38px;font:700 15px/1 -apple-system,'SF Pro Text',Manrope,sans-serif}
.sb .ic{display:flex;gap:6px;align-items:center}
.sb .ic i{display:block;background:currentColor;border-radius:2px}
.tg{height:52px;display:grid;grid-template-columns:100px 1fr 100px;align-items:center;padding:0 14px;font-family:-apple-system,'SF Pro Text',Manrope,sans-serif}
.tg .x{color:var(--tg-link);font-size:16px;font-weight:500;white-space:nowrap}
.tg .t{text-align:center;font-size:16px;font-weight:700;line-height:1.15}
.tg .t small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.tg .m{justify-self:end;width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--mut);font-size:15px;letter-spacing:1px;line-height:0;padding-bottom:6px}
.scroll{position:absolute;top:102px;bottom:0;left:0;right:0;overflow:hidden}
.has-mb .scroll{bottom:94px}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.85;z-index:5}
.mb{position:absolute;left:0;right:0;bottom:0;padding:8px 16px 34px;background:var(--g);display:flex;gap:8px;z-index:4}
.mb.shade{box-shadow:0 -1px 0 var(--line)}
.mb button{flex:1;height:52px;border-radius:14px;background:var(--acc);color:var(--on-acc);font:700 16px/1 Manrope}
.mb button.sec{flex:.7;background:var(--soft);color:var(--on-soft)}
.mb button.off{background:var(--sunk);color:var(--mut)}
.note-tg{font:500 11px/1.3 Manrope;color:var(--mut);text-align:center;position:absolute;bottom:-1px;left:0;right:0}

/* ---------- today header (water) ---------- */
.a-head{position:relative;height:104px;padding:14px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;overflow:hidden}
.a-water{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 100%);background:var(--soft)}
.a-water svg{position:absolute;left:0;bottom:100%;width:100%;height:10px;display:block}
.a-water path{fill:var(--soft)}
.a-date,.a-prog{position:relative}
.a-date span{display:block;font:600 14px/1.3 Manrope;opacity:.85}
.a-date b{display:block;font:600 27px/1.15 Unbounded;letter-spacing:-.015em;margin-top:2px}
.a-prog{text-align:right;padding-top:2px}
.a-prog b{display:block;font:600 20px/1.2 Unbounded}
.a-prog span{font:600 13px/1.3 Manrope;opacity:.85}
.a-list{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.a-foot{padding:16px 20px 24px;font:500 14px/1.45 Manrope;color:var(--mut)}

/* ---------- habit card ---------- */
.a-card{background:var(--s);border-radius:24px;padding:18px 18px 16px;width:100%}
.a-card.paused{opacity:.7}
.a-id{font:500 19px/1.28 Unbounded;letter-spacing:-.01em}
.a-plan{font:500 15px/1.45 Manrope;color:var(--mut);margin-top:8px}
.a-plan b{color:var(--ink);font-weight:700}
.a-days{display:flex;justify-content:space-between;margin-top:16px}
.a-scale{display:flex;justify-content:space-between;font:600 11px/1 Manrope;color:var(--mut);margin-top:9px}
.a-meta{display:flex;gap:14px;margin-top:12px;font:600 14px/1.3 Manrope}
.a-meta span+span{color:var(--mut)}
.a-note{margin-top:10px;font:500 14px/1.4 Manrope;color:var(--mut)}
.a-warn{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--amb-soft);color:var(--amb-ink);font:600 14px/1.4 Manrope}
.a-warn span{display:block;color:var(--ink);font-weight:500;margin-top:2px}
.a-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.a-btn{height:56px;border-radius:16px;font:700 16px/1 Manrope;transition:transform .1s}
.a-btn.pri{background:var(--acc);color:var(--on-acc)}
.a-btn.sec{background:var(--soft);color:var(--on-soft)}
.a-btn:active{transform:scale(.98)}
.a-done{display:flex;justify-content:space-between;align-items:center;height:56px;margin-top:14px;border-top:1px solid var(--line)}
.a-done b{font:700 15px/1.3 Manrope;display:flex;align-items:center;gap:8px}
.a-done small{display:block;font:500 13px/1.3 Manrope;color:var(--mut)}
.a-done button{font:700 14px/1 Manrope;color:var(--acc-ink);padding:14px 0 14px 14px}

/* ---------- day cells ---------- */
.day{position:relative;display:block;flex:none;width:18px;height:18px;border-radius:50%}
.day .fill{position:absolute;inset:0;border-radius:inherit}
.day .drop{position:absolute;left:50%;top:-4px;width:9px;height:9px;margin-left:-4.5px;background:var(--acc);border-radius:0 50% 50% 50%;transform:rotate(45deg);opacity:0;pointer-events:none}
.day .rip{position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--acc);opacity:0;pointer-events:none}
.s-d .fill{background:var(--acc)}
.s-m .fill{background:var(--soft);box-shadow:inset 0 0 0 2px var(--acc)}
.s-x .fill{inset:6px;background:var(--mut);opacity:.6}
.s-xx .fill{inset:5px;background:var(--amb)}
.s-t .fill{border:1.5px dashed var(--mut)}
.s-e .fill{border:1.5px solid var(--mut);opacity:.4}
.day.today{outline:1.5px solid var(--ink);outline-offset:3px}
.day.sm{width:12px;height:12px}.day.sm .fill{inset:0}.day.sm.s-x .fill{inset:4px}
.day.just .drop{animation:fall .46s cubic-bezier(.55,0,.9,.4) both}
.day.just .fill{animation:fillIn .32s .42s cubic-bezier(.2,.8,.3,1.2) both}
.day.just .rip{animation:rip .7s .44s ease-out both}
@keyframes fall{0%{opacity:0;transform:translateY(-34px) rotate(45deg) scale(.6)}25%{opacity:1}92%{opacity:1;transform:translateY(6px) rotate(45deg) scale(1)}100%{opacity:0;transform:translateY(9px) rotate(45deg) scale(.4)}}
@keyframes fillIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rip{from{transform:scale(.8);opacity:.7}to{transform:scale(2.3);opacity:0}}
.swap{animation:swapIn .35s .5s both}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- forms ---------- */
.pad{padding:8px 16px 24px}
.h-screen{font:600 24px/1.2 Unbounded;letter-spacing:-.015em;padding:6px 4px 0}
.sub{font:500 15px/1.45 Manrope;color:var(--mut);margin-top:8px;padding:0 4px}
.steps{display:flex;gap:6px;padding:4px 20px 0}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--acc)}
.stepl{font:600 13px/1 Manrope;color:var(--mut);padding:14px 20px 0}
.fld{margin-top:18px}
.fld>label,.lbl{display:flex;justify-content:space-between;align-items:baseline;font:700 14px/1.3 Manrope;padding:0 4px 8px}
.fld>label small,.lbl small{font-weight:500;color:var(--mut)}
.inp{display:flex;align-items:center;min-height:56px;padding:14px 16px;border-radius:16px;background:var(--s);font:500 16px/1.4 Manrope;color:var(--ink);width:100%}
.inp.ph{color:var(--mut)}
.inp.focus{box-shadow:inset 0 0 0 2px var(--acc)}
.inp .pre{color:var(--mut);margin-right:6px;white-space:nowrap}
.inp.big{font:500 18px/1.35 Unbounded;letter-spacing:-.01em;min-height:64px}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--acc);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{font:500 13px/1.4 Manrope;color:var(--mut);padding:8px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:40px;padding:9px 14px;border-radius:999px;background:var(--s);font:600 14px/1.35 Manrope;color:var(--ink);text-align:left}
.chip.on{background:var(--soft);color:var(--on-soft);box-shadow:inset 0 0 0 1.5px var(--acc)}
.sec-n{display:flex;gap:12px;align-items:baseline;margin-top:26px;padding:0 4px}
.sec-n i{font:600 13px/1 Unbounded;font-style:normal;color:var(--acc-ink)}
.sec-n b{font:600 17px/1.3 Unbounded;letter-spacing:-.01em}

/* AI suggestion */
.ai{margin-top:10px;border-radius:18px;padding:14px 14px 12px;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--soft);position:relative}
.ai-h{display:flex;align-items:center;gap:8px;font:700 13px/1 Manrope;color:var(--acc-ink)}
.ai-h .ai-mark{width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--acc) 0 50%,var(--soft) 0);flex:none}
.ai-h span{margin-left:auto;font-weight:500;color:var(--mut)}
.ai-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.ai-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--s);font:600 15px/1.35 Manrope;text-align:left;width:100%}
.ai-opt small{flex:none;font:700 13px/1 Manrope;color:var(--acc-ink)}
.ai-opt.on{background:var(--soft);color:var(--on-soft)}
.ai-opt.on small{color:var(--on-soft)}
.ai-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:500 12px/1.3 Manrope;color:var(--mut)}
.ai-f button{font:700 13px/1 Manrope;color:var(--acc-ink);padding:8px 0 8px 8px}
.ai-load{display:flex;gap:6px;margin-top:14px}
.ai-load i{height:44px;flex:1;border-radius:12px;background:linear-gradient(90deg,var(--s) 0 40%,var(--s2) 50%,var(--s) 60% 100%);background-size:300% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}

/* lists, toggles */
.group{margin-top:12px;border-radius:18px;background:var(--s);overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;font:600 15px/1.35 Manrope;width:100%;text-align:left}
.li+.li{box-shadow:inset 0 1px 0 var(--line)}
.li small{display:block;font:500 13px/1.35 Manrope;color:var(--mut);margin-top:2px}
.li .v{color:var(--mut);font-weight:600;white-space:nowrap}
.li .v::after{content:' ›';color:var(--mut)}
.li.danger{color:var(--tg-red)}
.tog{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--acc)}
.tog.on::after{transform:translateX(20px)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.wd button{height:44px;border-radius:12px;background:var(--s);font:700 14px/1 Manrope;color:var(--mut)}
.wd button.on{background:var(--soft);color:var(--on-soft)}
.timebig{font:600 56px/1 Unbounded;letter-spacing:-.03em;text-align:center;padding:18px 0 4px}
.timebig small{display:block;font:500 14px/1.4 Manrope;letter-spacing:0;color:var(--mut);margin-top:10px}

/* sheet + overlay */
.dim{position:absolute;inset:0;background:rgba(5,8,15,.55);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--s);border-radius:24px 24px 0 0;padding:10px 16px 34px}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font:600 18px/1.3 Unbounded;padding:0 4px}
.wheel{position:relative;display:flex;justify-content:center;gap:28px;height:220px;margin:12px 0 16px;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::before{content:'';position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--sunk)}
.wheel div{position:relative;display:flex;flex-direction:column;align-items:center}
.wheel span{height:44px;line-height:44px;font:500 22px/44px Manrope;color:var(--mut);width:64px;text-align:center}
.wheel span.on{color:var(--ink);font:600 26px/44px Unbounded}
.wheel em{position:relative;align-self:center;font:600 26px Unbounded;font-style:normal}
.sbtn{display:block;width:100%;height:56px;border-radius:16px;background:var(--acc);color:var(--on-acc);font:700 16px/1 Manrope}
.sbtn.sec{background:var(--soft);color:var(--on-soft);margin-top:8px}
/* telegram native popup */
.pop{position:absolute;left:50%;top:50%;width:300px;margin-left:-150px;transform:translateY(-50%);z-index:7;border-radius:16px;background:var(--tg-pop);overflow:hidden;font-family:-apple-system,'SF Pro Text',Manrope,sans-serif;text-align:center}
.pop h4{font-size:17px;font-weight:700;padding:20px 18px 6px}
.pop p{font-size:14px;line-height:1.4;color:var(--ink);opacity:.85;padding:0 18px 18px}
.pop button{display:block;width:100%;height:46px;font-size:17px;color:var(--tg-link);border-top:1px solid var(--line)}
.pop button.red{color:var(--tg-red)}
.pop button.b{font-weight:600}

@media (prefers-reduced-motion:reduce){.day.just .drop,.day.just .rip{animation:none}.day.just .fill,.swap{animation-duration:.01s;animation-delay:0s}.phone{transition:none}.caret,.ai-load i{animation:none}}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.empty-row .day:first-child .drop{animation:fallLoop 3.6s cubic-bezier(.55,0,.9,.4) infinite}
.empty-row .day:first-child .rip{animation:ripLoop 3.6s ease-out infinite}
@keyframes fallLoop{0%,55%{opacity:0;transform:translateY(-40px) rotate(45deg) scale(.6)}62%{opacity:1}68%{opacity:1;transform:translateY(6px) rotate(45deg)}70%,100%{opacity:0;transform:translateY(9px) rotate(45deg) scale(.4)}}
@keyframes ripLoop{0%,68%{opacity:0;transform:scale(.8)}70%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.empty-row .day:first-child .drop,.empty-row .day:first-child .rip{animation:none}}
.pv{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--soft);color:var(--on-soft);font:500 15px/1.45 Manrope}
.pv b{color:var(--ink);font-weight:700}
.th-light .pv b{color:var(--ink)}
.th{color:var(--ink)}
</style></head><body>
<div id="root"></div>
<script>const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
const votesW=n=>n+' '+plural(n,'голос','голоса','голосов');
const daysW=n=>n+' '+plural(n,'день','дня','дней');
const now=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const HAB={
 read:()=>({id:'read',identity:'Я человек, который читает',anchor:'После утреннего кофе',full:'читаю 30 минут',mini:'одна страница',votes:23,streak:6,
  days:['d','d','m','d','x','d','d','d','m','d','d','d','d'],today:'d',time:'7:42'}),
 move:()=>({id:'move',identity:'Я человек, который двигается',anchor:'Когда закрою ноутбук',full:'гуляю 20 минут',mini:'надеть кроссовки и выйти за дверь',votes:11,streak:4,
  days:['d','x','m','d','d','x','d','m','d','d','d','m','x'],today:null}),
};
const cell=(s,o={})=>`<span class="day ${o.sm?'sm ':''}s-${s||'t'}${o.today?' today':''}${o.just?' just':''}"><i class="fill"></i><i class="drop"></i><i class="rip"></i></span>`;
const daysRow=(h,just)=>{
  const d=h.days.slice();
  // two misses in a row right before today → amber
  if(d[12]==='x'&&d[11]==='x'){d[12]='xx';d[11]='xx';}
  return d.map(s=>cell(s)).join('')+cell(h.today,{today:1,just});
};
const twoMiss=h=>!h.today&&h.days[12]==='x'&&h.days[11]==='x';
const oneMiss=h=>!h.today&&h.days[12]==='x'&&h.days[11]!=='x';

function cardHTML(h,just){
  const two=twoMiss(h),one=oneMiss(h);
  const streak=two?'серия начнётся заново':h.streak?`серия ${daysW(h.streak)}`:'серия начнётся с сегодня';
  const acts=h.today
    ?`<div class="a-done${just?' swap':''}"><span><b>${cell(h.today,{sm:1})}${h.today==='d'?'Сделал полностью':'Две минуты засчитаны'}</b><small>в ${h.time} · ещё один голос</small></span><button data-act="undo" data-h="${h.id}">Отменить</button></div>`
    :two?`<div class="a-acts"><button class="a-btn sec" data-act="d" data-h="${h.id}">Сделал</button><button class="a-btn pri" data-act="m" data-h="${h.id}">Хотя бы 2 минуты</button></div>`
    :`<div class="a-acts"><button class="a-btn pri" data-act="d" data-h="${h.id}">Сделал</button><button class="a-btn sec" data-act="m" data-h="${h.id}">Хотя бы 2 минуты</button></div>`;
  return `<article class="a-card">
    <h2 class="a-id">${h.identity}</h2>
    <p class="a-plan">${h.anchor} — <b>${h.full}</b><br>или хотя бы ${h.mini}</p>
    <div class="a-days">${daysRow(h,just)}</div>
    <div class="a-scale"><span>2 недели назад</span><span>сегодня</span></div>
    <div class="a-meta">${h.votes?`<span>${votesW(h.votes)}</span><span>${streak}</span>`:'<span>Первый голос — сегодня</span>'}</div>
    ${one?'<p class="a-note">Вчера пропуск — это нормально. Сегодня хватит и двух минут.</p>':''}
    ${two?`<div class="a-warn">Два дня без капли<span>Голоса никуда не делись — их ${h.votes}. Вернись с двух минут: ${h.mini}.</span></div>`:''}
    ${acts}</article>`;
}

/* registry of live habits for marking */
const REG={};let regN=0;
function liveCard(h,group){const k='c'+(regN++);REG[k]={h,group};return `<div class="hc" data-k="${k}">${cardHTML(h)}</div>`;}
function syncHeader(group){
  const ks=Object.values(REG).filter(r=>r.group===group);if(!ks.length)return;
  const n=ks.filter(r=>r.h.today).length,t=ks.length;
  document.querySelectorAll(`[data-group="${group}"]`).forEach(ph=>{
    ph.style.setProperty('--p',n/t);
    const pr=ph.querySelector('[data-prog]');
    if(pr)pr.innerHTML=`<b>${n} из ${t}</b><span>${n===t?'день наполнен':'капли сегодня'}</span>`;
  });
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const w=b.closest('.hc');if(!w)return;const r=REG[w.dataset.k];const h=r.h;
  if(b.dataset.act==='undo'){h.today=null;h.votes--;h.streak=h._s??h.streak;}
  else{const two=twoMiss(h);h._s=h.streak;h.today=b.dataset.act;h.votes++;h.streak=two?1:h.streak+1;h.time=now();}
  w.innerHTML=cardHTML(h,b.dataset.act!=='undo');syncHeader(r.group);
});

const chrome=(o={})=>`<div class="sb"><span>9:41</span><span class="ic"><i style="width:17px;height:10px"></i><i style="width:15px;height:10px;border-radius:5px 5px 2px 2px"></i><i style="width:25px;height:12px;border-radius:4px"></i></span></div>
<div class="tg"><span class="x">${o.back?'‹ Назад':'Закрыть'}</span><span class="t">Капля<small>мини-приложение</small></span><span class="m">···</span></div>`;
function phone(o){
  const mb=o.main?`<div class="mb${o.shade?' shade':''}">${o.second?`<button class="sec">${o.second}</button>`:''}<button class="${o.mainOff?'off':''}">${o.main}</button></div>`:'';
  return `<div class="phone${o.main?' has-mb':''}${o.long?' long':''}"${o.group?` data-group="${o.group}"`:''}${o.p!=null?` style="--p:${o.p}"`:''}>${chrome(o)}<div class="scroll">${o.body}</div>${o.over||''}${mb}<div class="home"></div></div>`;
}
const col=(ph,cap)=>`<div class="col">${ph}<span class="cap">${cap}</span></div>`;
function stage({kicker,title,desc,cols}){
  document.getElementById('root').innerHTML=`<div class="stage">
  <div class="intro"><div><h1><small>${kicker}</small>${title}</h1><p>${desc}</p></div>
  <div class="thsw" role="group" aria-label="Тема"><button aria-pressed="true" data-th="dark">Тёмная</button><button aria-pressed="false" data-th="light">Светлая</button></div></div>
  <div class="row">${cols.join('')}</div></div>`;
  [...new Set(Object.values(REG).map(r=>r.group))].forEach(syncHeader);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-th]');if(!b)return;
  const st=b.closest('.stage');st.classList.toggle('th-light',b.dataset.th==='light');
  st.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
const todayHead=(group)=>`<header class="a-head"><div class="a-water"><svg viewBox="0 0 390 10" preserveAspectRatio="none"><path d="M0 10V6C70 1 120 1 195 5S320 9 390 4V10Z"/></svg></div>
  <div class="a-date"><span>Пятница</span><b>2 октября</b></div><div class="a-prog" data-prog></div></header>`;

const st=[];
const base=HAB.move();
const a=HAB.move();a.days[12]='d';a.streak=5;st.push(['Не отмечено',a]);
st.push(['Сделал',HAB.read()]);
const c=HAB.read();c.today='m';st.push(['Две минуты',c]);
st.push(['Вчера пропуск',HAB.move()]);
const e=HAB.move();e.days[11]='x';e.streak=0;st.push(['Два дня пропуска',e]);
const legend=[['d','Сделал полностью'],['m','Хотя бы две минуты — засчитано, но видно, что облегчённо'],['x','Пропуск'],['xx','Два пропуска подряд'],['t','Сегодня, ещё не отмечено'],['e','До начала привычки']];
const leg=`<div class="th a-card" style="background:var(--s)"><h2 class="a-id">Ряд дней</h2>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">${legend.map(([s,t])=>`<div style="display:flex;gap:14px;align-items:center;font:500 14px/1.35 Manrope">${cell(s,{today:s==='t'})}<span>${t}</span></div>`).join('')}</div>
<p class="a-note" style="margin-top:16px">Состояния различаются формой, а не только цветом.</p>
<div style="display:flex;align-items:center;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><span id="demo">${cell('d',{today:1,just:1})}</span><button class="chip" id="replay">Повторить каплю</button></div></div>`;
const wrap=(t,inner)=>`<div class="col" style="width:358px;align-items:stretch"><span class="cap" style="text-align:left">${t}</span><div class="th" style="background:var(--g);border-radius:28px;padding:12px">${inner}</div></div>`;
stage({kicker:'Экран 3 · компонент',title:'Карточка привычки',desc:'Пять состояний. После двух пропусков главной становится кнопка «Хотя бы 2 минуты» — так проще вернуться. Янтарный появляется только тут, и без упрёка. Все карточки живые.',
cols:[...st.map(([t,h],i)=>wrap(t,liveCard(h,'s'+i))),wrap('Обозначения и анимация',leg)]});
document.addEventListener('click',ev=>{if(ev.target.id==='replay'){const d=document.getElementById('demo');d.innerHTML='';requestAnimationFrame(()=>d.innerHTML=cell('d',{today:1,just:1}));}});
</script></body></html>
